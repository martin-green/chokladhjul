[package]
name = "chokladhjul"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.5"
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

